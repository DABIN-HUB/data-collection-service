name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven verify
        run: mvn -B -ntp verify

      - name: 检查前端脚本语法
        run: |
          node --check src/main/resources/static/admin/app.js
          node --check src/main/resources/static/admin/design-lab.js
          node scripts/verify-admin-console.mjs

      - name: 扫描生产配置秘密
        run: node scripts/scan-config-secrets.mjs

      - name: 执行P0固定回归
        run: mvn -B -ntp -Pp0-regression test

      - name: 检查UTF-8编码
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            iconv -f UTF-8 -t UTF-8 "$file" >/dev/null || exit 1
          done < <(find src docs -type f \( -name '*.java' -o -name '*.js' -o -name '*.html' -o -name '*.css' -o -name '*.yml' -o -name '*.md' \) -print0)
