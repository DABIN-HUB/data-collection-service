name: CI

on:
  push:
    branches: [ main, master, fix/feature-2-runtime-stabilization ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: collector-desktop/package-lock.json

      - name: 安装桌面控制台依赖
        run: npm ci --prefix collector-desktop

      - name: 桌面控制台类型检查
        run: npm --prefix collector-desktop run typecheck

      - name: 桌面控制台测试（诊断继续）
        continue-on-error: true
        run: npm --prefix collector-desktop test

      - name: 构建并同步网页控制台
        run: npm --prefix collector-desktop run build:web

      - name: Maven clean package（跳过测试）
        run: mvn -B -ntp clean package -DskipTests

      - name: 检查最终可执行Jar
        shell: bash
        run: |
          jar_file="$(find collector-boot/target -maxdepth 1 -type f \
            -name 'data-collection-service-*.jar' \
            ! -name 'original-*.jar' \
            ! -name '*.original' \
            -print -quit)"
          if [ -z "$jar_file" ]; then
            echo "未找到 collector-boot 最终可执行 jar"
            exit 1
          fi
          echo "检查 Jar：$jar_file"
          jar tf "$jar_file" | grep -q '^BOOT-INF/classes/com/wangbin/collector/Application.class$'
          jar tf "$jar_file" | grep -q '^BOOT-INF/classes/static/desktop/index.html$'
          jar tf "$jar_file" | grep -q '^BOOT-INF/classes/static/desktop/assets/.*\.js$'
          jar tf "$jar_file" | grep -q '^BOOT-INF/classes/static/desktop/assets/.*\.css$'

      - name: 执行P0固定回归（诊断继续）
        continue-on-error: true
        run: mvn -B -ntp -pl collector-boot -am -Pp0-regression test
