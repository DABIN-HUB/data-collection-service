name: CI

on:
  push:
    branches: [ main, master, fix/feature-2-runtime-stabilization ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: collector-desktop/package-lock.json

      - name: 安装桌面控制台依赖
        run: npm ci --prefix collector-desktop

      - name: 桌面控制台类型检查
        run: npm --prefix collector-desktop run typecheck

      - name: 桌面控制台测试（诊断继续）
        continue-on-error: true
        run: npm --prefix collector-desktop test

      - name: 构建并同步网页控制台
        run: npm --prefix collector-desktop run build:web

      - name: Maven clean package diagnostics
        id: maven_package
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mvn -B -ntp clean package -DskipTests 2>&1 | tee /tmp/maven-package.log

      - name: Upload Maven diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-package-log
          path: /tmp/maven-package.log
          if-no-files-found: error

      - name: Fail when Maven package failed
        if: steps.maven_package.outcome != 'success'
        run: exit 1

      - name: 检查最终可执行Jar
        shell: bash
        run: |
          jar_file="$(find collector-boot/target -maxdepth 1 -type f \
            -name 'data-collection-service-*.jar' \
            ! -name 'original-*.jar' \
            ! -name '*.original' \
            -print -quit)"
          if [ -z "$jar_file" ]; then
            echo "未找到 collector-boot 最终可执行 jar"
            exit 1
          fi
          echo "检查 Jar：$jar_file"
          jar tf "$jar_file" | grep -q '^BOOT-INF/classes/com/wangbin/collector/Application.class$'
          jar tf "$jar_file" | grep -q '^BOOT-INF/classes/static/desktop/index.html$'
          jar tf "$jar_file" | grep -q '^BOOT-INF/classes/static/desktop/assets/.*\.js$'
          jar tf "$jar_file" | grep -q '^BOOT-INF/classes/static/desktop/assets/.*\.css$'
