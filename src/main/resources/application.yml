server:
  port: 9090
  servlet:
    context-path: /collector
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 2048
  tomcat:
    max-threads: 200
    min-spare-threads: 20
    connection-timeout: 5000
    accept-count: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
spring:
  application:
    name: data-collection-service
  profiles:
    active: dev
  datasource:
    driver-class-name: com.taosdata.jdbc.rs.RestfulDriver
    url: jdbc:TAOS-RS://127.0.0.1:6041/wangbin_collector
    username: root
    password: taosdata
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000
      password: 123456888wb
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1
        shutdown-timeout: 100ms
      # 采集实时数据 Redis Stream 配置
      stream:
        enabled: true
        key: collector:telemetry:stream
        retention-mode: COUNT  # 可选 COUNT（最近 max-length 条数据）或 TIME（最近 max-seconds 秒数据）
        max-length: 200
        max-seconds: 60
        approximate-trim: true  # 为 true 时使用近似裁剪
        trim-task-enabled: true # 为 true 时启用 TIME 模式定时裁剪
        trim-interval-ms: 5000  # 裁剪周期

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  task:
    execution:
      pool:
        core-size: 10
        max-size: 50
        queue-capacity: 1000
        keep-alive: 60s
      thread-name-prefix: async-task-

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.wangbin.collector.common.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.wangbin.collector: INFO
    org.springframework: INFO
    org.springframework.web: INFO
    org.mybatis: ERROR
    org.mybatis.spring: ERROR
    com.baomidou.mybatisplus: ERROR
    com.zaxxer.hikari: WARN
    com.wangbin.collector.mapper: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/collector.log
    max-size: 10MB
    max-history: 30
  access:
    enabled: true
    include-paths:
      - /api/**
    exclude-paths:
      - /health
      - /actuator/**
    high-risk-rules:
      - method: POST
        pattern: /api/config/import
      - method: POST
        pattern: /api/config/device/**/clear
      - method: POST
        pattern: /api/config/sync/**
    token-header: X-Collector-Token
    request-id-header: X-Request-Id
    max-query-length: 512

telemetry:
  tdengine:
    enabled: true
    database: wangbin_collector
    super-table: wangbin_super
    sub-table-prefix: d_
    alarm-super-table: alarm_super
    alarm-sub-table-prefix: d_alarm_
    auto-create: true
    keep-days: 30
    query-default-limit: 500
    query-max-limit: 5000

collector:
  auth:
    permit-all-paths:
      - /health
      - /actuator/**
      - /admin/**
    ops-tokens:
      ops-token: 本地开发运维令牌
  # 自适应采集配置
  adaptive-collection:
    enabled: true          # 自适应采集开关，默认开启
    adjust-window-ms: 60000 # 调整窗口，默认 1 分钟
  # 采集任务调度配置
  scheduler:
    # 初始时间片数量：调度器启动时分配给每个任务的时间片数量
    initial-time-slice-count: 4
    # 最大时间片数量：每个任务最多可以获得的时间片数量上限
    max-time-slice-count: 12
    # 最小时间片间隔（毫秒）：防止过度频繁调度
    min-time-slice-interval-ms: 300
    # 默认时间片间隔（毫秒）：默认情况下时间片长度
    default-time-slice-interval-ms: 1500
    # 初始时间片间隔（毫秒）：调度器启动时使用的时间片间隔
    initial-time-slice-interval-ms: 1500
    # 动态调整间隔（毫秒）：调度器动态调整时间片分配策略的周期
    dynamic-adjust-interval-ms: 60000
    # 收集超时时间（毫秒）：等待任务执行结果或状态收集的最大等待时间
    collect-timeout-ms: 800

## 从云端获取配置数据地址，配套服务
  config:
    yun-url: http://127.0.0.1:48080/admin-api
    sync-interval: 300000
    service-id: collector-1
    tenant-id: 1
    api-token: ""
  cache:
    type: local
    local:
      max-size: 10000
      expire-after-write: 300
      expire-after-access: 60
      initial-capacity: 1000
    redis:
      key-prefix: "collector:cache:"
      default-expire: 3600
      connection-timeout: 3000

  # 数据上报配置
  report:
    enabled: true
    mode: mqtt
    batch-size: 100
    intervalMs: 1000
    timeout: 3000
    retry-times: 3
    max-queue-size: 5000
    flush-interval: 1000
    shadow:
      persistence-enabled: true
      cas-enabled: true
      key-prefix: "collector:shadow:"
      ttl-seconds: 86400
      auto-merge-enabled: true
      merge-retry-times: 2
      history-enabled: true
      history-key-prefix: "collector:shadow:history:"
      history-max-records: 100
      history-ttl-seconds: 604800
    cloud:
      payload:
        profile: compact
        include-quality: on_error
        include-property-ts: false
        include-metadata: false
        include-message-id: true
      ack:
        mode: async
        timeout-ms: 5000
        max-pending: 10000
        timeout-scan-ms: 500
        commit-on: publish-success
      batch:
        enabled: true
        max-devices-per-pack: 50
        max-properties-per-pack: 500
        max-payload-bytes: 131072
        max-delay-ms: 1000
        high-priority-bypass: true
    # 云端上报与平台 MQTT 下行配置（ReportHandler / ACK / 统一下行入口）
    mqtt:
      enabled: true
      broker-url: tcp://127.0.0.1:1883
      client-id: QbEy71mjtoh5AwYr.ces111
      username: ces111&QbEy71mjtoh5AwYr
      password: e3e010c4ec2ace39ba2cebe559720d62b39fbaa98f507640294233d464325440
      topic-prefix: /sys
      ack-topic-prefix: /sys
      gateway-product-key: QbEy71mjtoh5AwYr
      gateway-device-name: ces111
      cloud-provider: alink
      ack-topic-suffix: _reply
      ack-timeout-seconds: 5
      qos: 1
      clean-session: true
      connection-timeout: 30
      keep-alive-interval: 60
      topics:
        property: thing/property/post
        event: thing/event/post
        state: thing/state/update
      service-command-mappings: {}  # 平台服务名 -> 协议命令名映射，未配置时直接使用原 service/identifier

  # MQTT 采集协议默认连接兜底配置（MqttCollector）
  mqtt:
    broker-url: tcp://127.0.0.1:1883
    client-id: data-collector
    username:
    password:
    qos: 1
    clean-session: true
    connection-timeout: 30
    keep-alive-interval: 60
